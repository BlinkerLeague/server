spring:
  config:
    # 로컬 secret은 저장소 밖의 .env(gitignore)에서 읽는다. 형식은 .env.example 참고.
    import: optional:file:.env[.properties]
  # 로컬 DB는 docker compose의 PostgreSQL이다(D3, D37). 서버보다 먼저 docker compose up -d.
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)만 만든다. 엔티티와 다르면 기동이 실패한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true

# API 문서: http://localhost:8080/swagger-ui.html , 명세 JSON: /v3/api-docs (local에서만)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 로컬 실행 로그를 콘솔과 함께 파일로도 남긴다(서버를 재시작해도 이전 오류를 볼 수 있게).
# logs/는 gitignore. 토큰 · secret · 요청 본문은 원래 로그에 남기지 않는다(CLAUDE.md 보안 규칙).
# show-sql은 콘솔(System.out)에만 찍혀 파일에는 들어가지 않는다.
logging:
  file:
    name: logs/server.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
