spring:
  datasource:
    url: jdbc:h2:mem:blinkerleague;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true

jwt:
  # 로컬 개발 전용 기본값. 운영 secret을 여기에 두지 않는다.
  secret: ${JWT_SECRET:local-development-only-secret-key-32bytes!}
