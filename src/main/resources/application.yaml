spring:
  application:
    name: server
  profiles:
    default: local
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

jwt:
  # 운영에서는 환경변수로만 주입한다. 32바이트 이상.
  secret: ${JWT_SECRET}
  access-ttl: 1h
  refresh-ttl: 30d
