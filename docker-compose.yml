services:
  postgres:
    image: postgres:16-alpine
    container_name: blinkerleague-postgres
    environment:
      # 값은 프로젝트 루트 .env에서 읽는다(docker compose가 자동으로 읽음). 비어 있으면 compose가 바로 멈춘다.
      POSTGRES_DB: ${DB_NAME:?DB_NAME을 .env에 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      TZ: Asia/Seoul
    ports:
      # 내 PC에서만 접속한다. 같은 네트워크의 다른 기기에 열지 않는다.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blinkerleague-redis
    # Refresh 토큰을 저장하므로 재시작해도 남도록 AOF 영구 저장을 켠다.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
